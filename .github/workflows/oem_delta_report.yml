name: Generate OEM Delta Report

on:
    schedule:
    # Runs every hour at minute 17; off-peak minutes are less likely to be
    # delayed or skipped than the heavily contended top of the hour.
        - cron: '17 * * * *'
    workflow_dispatch:
    # This allows you to run the script manually from the "Actions" tab

permissions:
    contents: write

env:
    # Full source link. Change this one variable if the delta URL changes;
    # the output filename is derived from the URL's stem, e.g.
    # .../oem-6.17-resolute.html -> reports/oem-6.17-resolute.md
    SOURCE_URL: https://kernel.ubuntu.com/oem-delta/dev/oem-6.17-resolute.html

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Generate Markdown report
          run: |
            mkdir -p reports
            # Derive the output name from the source URL's filename stem
            stem=$(basename "$SOURCE_URL" .html)
            out="reports/${stem}.md"
            python check_kernel_team_emails.py \
              "$SOURCE_URL" \
              --format markdown \
              --output "${out}.new"
            # The report embeds a "_Generated:" timestamp that changes on every
            # run, so compare with that line stripped to detect real changes.
            if [ -f "$out" ]; then
              old=$(mktemp); new=$(mktemp)
              sed '/^_Generated:/d' "$out" > "$old"
              sed '/^_Generated:/d' "${out}.new" > "$new"
              if cmp -s "$old" "$new"; then
                rm -f "${out}.new" "$old" "$new"
                echo "Report content unchanged; keeping the existing file."
                exit 0
              fi
              rm -f "$old" "$new"
            fi
            mv "${out}.new" "$out"

        - name: Commit and push reports
          run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add reports/
            if git diff --cached --quiet; then
              echo "Nothing to commit."
            else
              git commit -m "Automated report update: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git push
            fi
